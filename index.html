<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Budsjettoversikt</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <header>
            <h1>Budsjettoversikt</h1>
            <p>Få oversikt over økonomien din.</p>
        </header>

        <section class="summary">

            <div class="summary-card">
                <h2>Inntekter</h2>
                <p id="income">0 kr</p>
            </div>

            <div class="summary-card">
                <h2>Utgifter</h2>
                <p id="expenses">0 kr</p>
            </div>

            <div class="summary-card">
                <h2>Saldo</h2>
                <p id="balance">0 kr</p>
            </div>

        </section>

        <section class="forbruk-graf">

            <h2>Inntekter og utgifter</h2>

            <div class="graf">

                <div class="graf-rad">
                    <span>Inntekter</span>

                    <div class="graf-bakgrunn">
                        <div id="inntektGraf" class="graf-stolpe inntekt-stolpe"></div>
                    </div>

                    <strong id="inntektGrafBeløp">0 kr</strong>
                </div>

                <div class="graf-rad">
                    <span>Utgifter</span>

                    <div class="graf-bakgrunn">
                        <div id="utgiftGraf" class="graf-stolpe utgift-stolpe"></div>
                    </div>

                    <strong id="utgiftGrafBeløp">0 kr</strong>
                </div>

            </div>

        </section>

        <section class="form-section">

            <h2>Legg til transaksjon</h2>

            <form id="transactionForm">

                <label for="description">Beskrivelse</label>
                <input 
                    type="text" 
                    id="description" 
                    placeholder="f.eks. Dagligvarer"
                    required
                >

                <label for="amount">Beløp</label>
                <input 
                    type="number" 
                    id="amount" 
                    placeholder="f.eks. 500"
                    min="0"
                    required
                >

                <label for="type">Type</label>
                <select id="type">
                    <option value="expense">Utgift</option>
                    <option value="income">Inntekt</option>
                </select>

                <label for="category">Kategori</label>
                <select id="category">
                    <option value="Mat">Mat</option>
                </select>

                <button type="submit">Legg til transaksjon</button>

            </form>

        </section>

        <section class="transactions">

            <h2>Transaksjoner</h2>

            <div id="transactionList">
                <p class="empty-message">Ingen transaksjoner ennå.</p>
            </div>

        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
